name: build-exe
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencv-python pillow numpy pyinstaller
      - run: pyinstaller --noconsole --onefile --collect-all cv2 --name PaperScan paperscan.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaperScan-exe
          path: dist/PaperScan.exe
